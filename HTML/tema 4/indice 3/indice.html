
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS FLEXBOX</h1>

    <h2>1. Flex direction</h2>

    <div class="contenedor direction">
        <div class="caja">1</div>
        <div class="caja">2</div>
        <div class="caja">3</div>
    </div>

    <h2>2. Justify content</h2>

    <div class="contenedor justify">
        <div class="caja">1</div>
        <div class="caja">2</div>
        <div class="caja">3</div>
    </div>

    <h2>3. Align items</h2>

    <div class="contenedor align">
        <div class="caja">1</div>
        <div class="caja">2</div>
        <div class="caja">3</div>
    </div>

    <h2>4. Flex wrap</h2>

    <div class="contenedor wrap">
        <div class="caja">1</div>
        <div class="caja">2</div>
        <div class="caja">3</div>
        <div class="caja">4</div>
        <div class="caja">5</div>
    </div>

    <h2>5. Align self</h2>

    <div class="contenedor self">
        <div class="caja">1</div>
        <div class="caja especial">2</div>
        <div class="caja">3</div>
    </div>

</body>
</html>
